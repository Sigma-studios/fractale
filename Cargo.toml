[package]
name = "fractale"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "A file explorer for finding what uses disk space, and for everyday browsing"
license = "MIT"
repository = "https://github.com/Sigma-studios/fractale"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
libc = "0.2"
serde_json = "1"
notify = "8.2"
rayon = "1.10"
# répertoire's scanner and tree, for sizing folders when the daemon isn't
# running (same rules, so numbers don't jump), and its client.
repertoire-core = { git = "https://github.com/Sigma-studios/repertoire", rev = "fd764be55fea9dc3547fbebcabb7a87156ffd17d" }
repertoire-proto = { git = "https://github.com/Sigma-studios/repertoire", rev = "fd764be55fea9dc3547fbebcabb7a87156ffd17d" }
# Previews.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "qoi", "tga", "ico", "hdr", "pnm"] }
# Decodes JPEGs at 1/2, 1/4 or 1/8 scale, much faster for big photos.
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.18"
md5 = { package = "md-5", version = "0.11" }
flate2 = "1"
lz4_flex = "0.11"
ron = "0.10"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6", features = ["all"] }
# The freedesktop trash (and macOS's). `chrono` writes DeletionDate, which
# the spec requires and KDE shows.
trash = { version = "5.2", default-features = false, features = ["chrono"] }
# Orchestre's song model and synth, for song and sound effect previews.
orchestre-core = { git = "https://github.com/Sigma-studios/orchestre", rev = "9969a78e79d9b446de1bc563182834ae9b9afe45" }
orchestre-dsp = { git = "https://github.com/Sigma-studios/orchestre", rev = "9969a78e79d9b446de1bc563182834ae9b9afe45" }

# macOS (development only): the text clipboard through egui and arboard.
# On Linux Fractale has its own Wayland data device (files and text), and
# eframe's clipboard would be a second one on the same seat.
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard"] }
arboard = { version = "3.7", default-features = false }

[dev-dependencies]
# The daemon itself, run in a helper process by the integration tests.
repertoire = { git = "https://github.com/Sigma-studios/repertoire", rev = "fd764be55fea9dc3547fbebcabb7a87156ffd17d" }
egui = "0.37"
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Dependencies' debug info is never used and makes test binaries (wgpu for
# snapshots) slow and memory-hungry to link.
[profile.dev.package."*"]
debug = false
